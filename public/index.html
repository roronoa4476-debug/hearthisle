<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hearthisle</title>
<link rel="icon" href="/art/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Nunito:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="/css/art.css">
<link rel="stylesheet" href="/css/main.css">
<script type="module" src="/js/main.js"></script>
</head>
<body>
<div id="app">
  <aside id="left" class="column" aria-label="Table">
    <header class="brand oak">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1>Hearthisle</h1>
      <button id="menu" class="icon-btn" type="button" aria-label="Game menu"><span class="burger" aria-hidden="true"></span></button>
    </header>
    <section id="players" class="panel oak" aria-label="Players"></section>
    <section id="bank" class="panel oak" aria-label="Bank"></section>
    <section id="log" class="panel paper" aria-label="Recent moves"></section>
  </aside>

  <main id="table" aria-label="Island">
    <div id="frame">
      <div id="board" role="group" aria-label="Island board"></div>
    </div>
    <div id="notice" role="status" aria-live="polite"></div>
  </main>

  <section id="dock" class="oak" aria-label="Your hand">
    <div id="hand"></div>
    <div id="builds"></div>
  </section>

  <aside id="right" class="column" aria-label="Actions">
    <section id="turn" class="panel oak" aria-label="Turn"></section>
    <section id="trade" class="panel oak" aria-label="Trade"></section>
    <section id="devs" class="panel oak" aria-label="Development cards"></section>
  </aside>

  <div id="modal-root"></div>
</div>
</body>
</html>
