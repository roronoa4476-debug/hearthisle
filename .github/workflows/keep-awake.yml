# Keeps the free Render server (Singapore) awake during the day so the first visitor
# doesn't wait for it to start (it sleeps after 15 minutes without visits).
# Every 10 minutes from 08:00 to 02:00 Pakistan time (03:00–20:59 UTC):
# about 560 server hours a month, inside Render's 750 free hours.
# GitHub may run scheduled jobs a few minutes late; that's fine here.
name: Keep the game awake

on:
  schedule:
    - cron: '*/10 3-20 * * *'
  workflow_dispatch: # can also be run by hand from the Actions tab

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visit the health check
        run: curl --silent --show-error --fail --retry 3 --retry-delay 20 --max-time 90 https://koolkatan-sg.onrender.com/api/health
