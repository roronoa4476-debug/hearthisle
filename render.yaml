# One-click setup for Render's free tier (https://render.com).
# Render reads this file when you create a "Blueprint" from the GitHub repo.
services:
  - type: web
    name: koolkatan
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Secret used to seal game backups so a restart can't lose a game. Render generates it once.
      - key: SNAPSHOT_SECRET
        generateValue: true

  # The same game in Singapore: about half the round-trip time from South Asia
  # (Pakistan: ~0.13 s instead of ~0.30 s to Oregon). Once it's live, the
  # service above forwards visitors here (REDIRECT_TO).
  - type: web
    name: koolkatan-sg
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SNAPSHOT_SECRET
        generateValue: true
