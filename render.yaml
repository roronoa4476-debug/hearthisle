# One-click setup for Render's free tier (https://render.com).
# Render reads this file when you create a "Blueprint" from the GitHub repo.
services:
  - type: web
    name: koolkatan
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Secret used to seal game backups so a restart can't lose a game. Render generates it once.
      - key: SNAPSHOT_SECRET
        generateValue: true

